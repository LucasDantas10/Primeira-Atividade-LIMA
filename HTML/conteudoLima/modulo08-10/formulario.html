<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <h1>Cadstro de Cliente</h1>
    <form action="">
      <label for="nome"> Nome: </label>
      <br />
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome completo"
        required
      />
      <br />
      <br />
      <br />
      <label for="email"> E-mail: </label>
      <br />
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Digite seu email   "
        required
      />
      <br /><br /><br />
      <label for="idade"> Idade: </label>
      <br />
      <input
        type="number"
        name="number"
        id="number"
        placeholder="Digite sua idade"
        
      />
      <br /><br />


      <label for="telefone"> Telefone: </label>
      <br />
      <input
        type="tel"
        name="telefone"
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(11)12345-6789"
      />
    </form>
  </body>
</html>
