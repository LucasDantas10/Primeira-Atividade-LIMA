<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo2</title>
    <style>
        body{
            background-color: aliceblue;
        }
        h1{
            color: navy;
            background-color: rgb(139, 110, 110) ;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        p{
            color: #333;
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>Segunda utilização do CSS - Tag Style</h1>
    <p>Testando a tag style na minha página HTML</p>
    <p style="color: white; background-color: #333;">
        Este é um segundo parágrafo, ele também está estilizado
    </p>
    
</body>
</html>
